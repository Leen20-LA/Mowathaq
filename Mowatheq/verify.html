<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موّثق | نتيجة التحقق</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">🛡️</span>
                <div class="logo-text">
                    <strong>موّثق</strong>
                    <span>Mowatheq</span>
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="verify.html" class="active">التحقق</a></li>
                <li><a href="reports.html">البلاغات</a></li>
                <li><a href="how-it-works.html">كيف يعمل</a></li>
                <li><a href="support.html">الدعم الفني</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content page-section">
        <div class="result-container" id="resultContainer" style="display: none;">
            <h2>نتيجة التحقق</h2>
            
            <div class="gauge-section">
                <div class="gauge">
                    <svg viewBox="0 0 140 140" width="150" height="150">
                        <circle class="gauge-bg" cx="70" cy="70" r="60"></circle>
                        <circle class="gauge-fg" id="gaugeFg" cx="70" cy="70" r="60" stroke-dasharray="377" stroke-dashoffset="377"></circle>
                    </svg>
                    <div class="gauge-text" id="gaugeText">0%</div>
                </div>
                <h3 id="resultTitle">جاري التحليل...</h3>
                <p id="resultDesc">...</p>
            </div>

            <div class="analysis-details">
                <div class="input-display">
                    <strong>النص المُدخل:</strong>
                    <p id="originalTextDisplay"></p>
                </div>
                
                <div class="reasons-box">
                    <strong>تفاصيل التحليل:</strong>
                    <ul id="reasonsList"></ul>
                </div>

                <div class="action-buttons">
                    <button class="btn-secondary" id="speakResultBtn">🔊 قراءة النتيجة</button>
                    <button class="btn-primary" onclick="window.location.href='index.html'">فحص رسالة أخرى</button>
                </div>
            </div>
        </div>

        <div class="empty-state" id="emptyState">
            <h2>لا توجد رسالة للتحليل</h2>
            <p>يرجى العودة للصفحة الرئيسية وإدخال الرسالة أو الرمز أولاً.</p>
            <button class="btn-primary" onclick="window.location.href='index.html'" style="margin-top: 20px;">العودة للرئيسية</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>

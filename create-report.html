<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حصّين | رفع بلاغ جديد</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #5A2022; 
            --bg-light: #7A2E31;
            --bg-color: #F9F7F4;
            --card-bg: #FFFFFF;
            --text-dark: #333333;
            --text-muted: #666666;
            --border-color: #E6E2DE;
        }

        body {
            background-color: #F9F7F4;
            color:#333333;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .report-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 30px;
            border-radius: 24px; /* زوايا دائرية مريحة للعين */
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 24px rgba(45, 106, 79, 0.08);
            text-align: center;
        }

        .app-header-brand {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .app-header-brand span {
            font-size: 32px;
        }

        p.subtitle {
            color: #40916C;
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .form-group {
            text-align: right;
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input, .form-textarea {
            width: 100%;
            background-color: #FAFDFB;
            border: 2px solid var(--border-color);
            color: var(--text-dark);
            padding: 15px;
            padding-left: 55px; /* ترك مساحة لزر المايك */
            border-radius: 14px;
            outline: none;
            font-size: 16px;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.1);
        }

        .form-textarea {
            height: 120px;
            resize: none;
        }

        /* زر الإدخال الصوتي - ميسر وواضح لكبار السن */
        .speech-btn {
            position: absolute;
            left: 12px;
            background-color: var(--border-color);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .speech-btn:hover {
            background-color: var(--text-muted);
            transform: scale(1.05);
        }

        .speech-btn.listening {
            background-color: #FF4D4D;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .action-row {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-ui {
            flex: 1;
            padding: 15px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            font-family: 'Tajawal', sans-serif;
        }

        .btn-ui-submit {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-ui-submit:hover {
            background-color: #1B4332;
        }

        .btn-ui-back {
            background-color: #E9F5ED;
            color: var(--primary-color);
        }

        .btn-ui-back:hover {
            background-color: var(--border-color);
        }

        .alert-success {
            display: none;
            background-color: #D8F3DC;
            color: #1B4332;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            margin-top: 15px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="report-card">
        <div class="app-header-brand">
            <span>🛡️</span> حصّين
        </div>
        <p class="subtitle">نحميك من الاحتيال ونسعد بمساعدتك</p>
        
        <form id="reportForm" onsubmit="sendReport(event)">
            
            <div class="form-group">
                <label for="suspectInput">الرابط أو الرقم المشبوه</label>
                <div class="input-wrapper">
                    <input type="text" id="suspectInput" class="form-input" placeholder="مثال: رقم اتصال أو رابط رسالة" required>
                    <button type="button" id="micSuspect" class="speech-btn" onclick="toggleVoiceInput('suspectInput', 'micSuspect')">🎤</button>
                </div>
            </div>

            <div class="form-group">
                <label for="detailsInput">تفاصيل الرسالة (اختياري)</label>
                <div class="input-wrapper">
                    <textarea id="detailsInput" class="form-textarea" placeholder="تحدث أو اكتب ما ورد في الرسالة السيئة..."></textarea>
                    <button type="button" id="micDetails" class="speech-btn" style="top: 15px;" onclick="toggleVoiceInput('detailsInput', 'micDetails')">🎤</button>
                </div>
            </div>

            <div class="action-row">
                <button type="submit" class="btn-ui btn-ui-submit">إرسال البلاغ للبنك</button>
                <button type="button" class="btn-ui btn-ui-back" onclick="window.history.back()">رجوع</button>
            </div>

            <div id="successAlert" class="alert-success">
                ✅ تم إرسال البلاغ بنجاح! شكراً لمساهمتك في حماية المجتمع.
            </div>
        </form>
    </div>

    <script>
        let activeRecognition = null;

        function toggleVoiceInput(targetId, btnId) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("جهازك لا يدعم خاصية التحدث صوتياً.");
                return;
            }

            const targetInput = document.getElementById(targetId);
            const micBtn = document.getElementById(btnId);

            if (activeRecognition) {
                activeRecognition.stop();
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.interimResults = false;
            activeRecognition = recognition;

            recognition.onstart = function() {
                micBtn.classList.add('listening');
                targetInput.placeholder = "تحدث الآن.. نحن نستمع إليك";
            };

            recognition.onresult = function(event) {
                const voiceText = event.results[0][0].transcript;
                if (targetId === 'suspectInput') {
                    // إزالة المسافات تلقائياً إذا تم إدخال رقم هاتف بالصوت
                    targetInput.value = voiceText.replace(/\s+/g, '');
                } else {
                    targetInput.value = voiceText;
                }
            };

            recognition.onend = function() {
                micBtn.classList.remove('listening');
                targetInput.placeholder = targetId === 'suspectInput' ? "مثال: رقم اتصال أو رابط رسالة" : "تحدث أو اكتب ما ورد في الرسالة السيئة...";
                activeRecognition = null;
            };

            recognition.onerror = function() {
                micBtn.classList.remove('listening');
                activeRecognition = null;
            };

            recognition.start();
        }

        function sendReport(e) {
            e.preventDefault();
            const suspectValue = document.getElementById('suspectInput').value.trim();
            const detailsValue = document.getElementById('detailsInput').value.trim();

            if (!suspectValue) return;

            // تحديد النوع تلقائياً
            const type = (suspectValue.includes('.') || suspectValue.includes('http')) ? 'رابط' : 'رقم';

            // تخزين البلاغ محلياً
            const existingReports = JSON.parse(localStorage.getItem('submittedReports') || '[]');
            existingReports.push({
                text: suspectValue,
                type: type,
                details: detailsValue || 'لا توجد تفاصيل إضافية',
                timestamp: new Date().toLocaleString('ar-SA')
            });

            localStorage.setItem('submittedReports', JSON.stringify(existingReports));

            // عرض تنبيه النجاح للمستخدم
            const successAlert = document.getElementById('successAlert');
            successAlert.style.display = 'block';

            setTimeout(() => {
                window.history.back();
            }, 2000);
        }
    </script>
</body>
</html>
